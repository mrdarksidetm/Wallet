name: CI Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests & Capture Diagnostics
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m"
        run: |
          mkdir -p build_logs
          ./gradlew testDebugUnitTest --stacktrace --info > build_logs/gradle_test_output.txt 2>&1 || true
          echo "=== COMPILER ERRORS ==="
          grep -n -C 3 "e: " build_logs/gradle_test_output.txt || true
          echo "=== FAILURES & STACKTRACES ==="
          grep -n -C 5 "FAILURE:" build_logs/gradle_test_output.txt || true
          echo "=== CAUSED BY ==="
          grep -n -C 5 "Caused by:" build_logs/gradle_test_output.txt || true
          find app/build/reports app/build/test-results -type f -exec cp {} build_logs/ \; 2>/dev/null || true

      - name: Upload Test and Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: build_logs/
          retention-days: 7

      - name: Enforce Test Success
        run: |
          if grep -q "BUILD SUCCESSFUL" build_logs/gradle_test_output.txt; then
            echo "CI Tests Passed Successfully!"
          else
            echo "CI Tests Failed!"
            exit 1
          fi
