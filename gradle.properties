# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details, see
# https://developer.android.com/studio/build/optimize-your-build

# JVM arguments optimized for low-memory host (4 GB RAM)
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Gradle build performance optimizations
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

# AndroidX and Kotlin settings
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
